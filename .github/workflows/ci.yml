name: CI Basic

on:
  push:
    branches: [ desarrollo ]
    paths:
      - '**'
  workflow_dispatch:

jobs:
  test:
    runs-on: self-hosted

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar tests
        run: node ./node_modules/jest/bin/jest.js
 
      - name: SAST con Semgrep
        run: |
          export PATH=$PATH:/home/juanjo/.local/bin
          pip3 install --user semgrep
          semgrep --config=auto

      - name: Escaneo de dependencias
        run: npm audit || true

      # ------------------------------
      # LEVANTAR MONITORING
      # ------------------------------
      - name: Levantar monitoring
        working-directory: ${{ github.workspace }}/monitoring
        run: |
          docker compose down || true
          docker compose up -d --build

      # ------------------------------
      # CREAR RED EXTERNA PARA LA APP
      # ------------------------------
      - name: Crear red monitoring-net si no existe
        run: docker network create monitoring-net || true

      # ------------------------------
      # LEVANTAR APP PRINCIPAL
      # ------------------------------
      - name: Levantar contenedores de la app
        working-directory: ${{ github.workspace }}
        run: |
          ls -l
          docker compose down || true
          docker compose up -d --build
          sleep 20
          docker compose ps
          curl -I http://localhost:3001 || true

      # ------------------------------
      # ZAP SCAN
      # ------------------------------
      - name: Ejecutar ZAP Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3001'
          cmd_options: '-r report_html.html'
          allow_issue_writing: false

      # ------------------------------
      # SUBIR REPORTE
      # ------------------------------
      - name: subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: ZAP-Report
          path: report_html.html
